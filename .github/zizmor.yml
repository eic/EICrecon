# Configuration for zizmor (https://docs.zizmor.sh), run by .github/workflows/zizmor.yml
#
# Accepted findings are annotated inline with `# zizmor: ignore[...]` and a
# justification, next to the code they apply to.
rules:
  # Actions are pinned by version tag throughout this repository, and kept
  # up to date by dependabot.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
