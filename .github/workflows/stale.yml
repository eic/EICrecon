name: "Mark stale issues and pull requests"
on:
  schedule:
  - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        days-before-stale: 180
        days-before-close: -1
        stale-issue-label: "stale"
        stale-pr-label: "stale"
        stale-issue-message: >
          This issue has been automatically marked as stale because it has not
          had recent activity in the last 6 months. It will not be closed
          automatically, but if you know this is not relevant anymore then please
          feel free to close it yourself. Thank you for your contributions.
        stale-pr-message: >
          This pull request has been automatically marked as stale because it
          has not had recent activity in the last 6 months. It will not be
          closed automatically, but if you know this is not relevant anymore then
          please feel free to close it yourself. Thank you for your contributions.
