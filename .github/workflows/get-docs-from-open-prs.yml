name: Get docs from open PRs

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  get-docs-from-open-prs:
    runs-on: ubuntu-24.04
    steps:
      - name: Download docs and capybara artifacts (other PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          runs_url="/repos/${GH_REPO}/actions/workflows/linux-eic-shell.yml/runs"
          runs_jq='[.workflow_runs[] | {id, head_sha, status, repo: .head_repository.full_name}]'
          # Queries filtered by head_sha (or status) are served by a search
          # index that intermittently returns a random subset of the matching
          # runs. As in action-download-artifact, also fetch the latest runs
          # without filters and match them locally. This only helps if the
          # newest matching run is among the latest 100 runs of the workflow.
          latest_runs=$(mktemp)
          gh api "${runs_url}?per_page=100" --jq "${runs_jq}" > "${latest_runs}"
          gh api "/repos/${GH_REPO}/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | "\(.number) \(.head.sha)"' |
          while read -r pr head_sha; do
            if [ "$pr" = "${THIS_PR:-}" ]; then
              echo "::group::PR $pr (this PR, downloaded separately)"
              echo "::endgroup::"
              continue
            fi
            echo "::group::PR $pr ($head_sha)"
            # Only consider completed runs whose head is in this repository,
            # i.e. skip fork PRs (same as allow_forks: false in
            # action-download-artifact). Status is matched locally to keep the
            # search index query minimal.
            # Pick the newest run by id (monotonic, unlike created_at which has
            # 1 s resolution) and do not rely on the API response order.
            run_id=$(
              {
                gh api "${runs_url}?head_sha=${head_sha}&per_page=100" --jq "${runs_jq}"
                cat "${latest_runs}"
              } |
              jq -rs --arg sha "${head_sha}" --arg repo "${GH_REPO}" '
                add
                | map(select(.head_sha == $sha and .status == "completed" and .repo == $repo))
                | max_by(.id) | .id // empty' \
              || true)
            if [ -z "$run_id" ]; then
              echo "No completed run found for PR $pr ($head_sha)"
              echo "::endgroup::"
              continue
            fi
            echo "Using run $run_id"
            gh run download "$run_id" --name docs --dir "publishing_docs/pr/${pr}/" \
              || echo "No docs artifact for PR $pr"
            gh run download "$run_id" --name capybara --dir "publishing_docs/pr/${pr}/capybara/" \
              || echo "No capybara artifact for PR $pr"
            echo "::endgroup::"
          done
      - name: Download docs artifact (this PR)
        uses: actions/download-artifact@v8
        if: github.event_name == 'pull_request'
        with:
          name: docs
          path: publishing_docs/pr/${{ github.event.pull_request.number }}/
      - name: Download capybara artifact (this PR)
        uses: actions/download-artifact@v8
        if: github.event_name == 'pull_request'
        with:
          name: capybara
          path: publishing_docs/pr/${{ github.event.pull_request.number }}/capybara/
      - name: Remove doxygen in PR
        run: rm -rf publishing_docs/pr/*/doxygen
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages-staging-prs
          path: publishing_docs/
          if-no-files-found: ignore
